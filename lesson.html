<!DOCTYPE html>

<html>
<head>
<title>Lesson</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  font-family: Poppins;
  background: #F9FAFB;
  padding: 20px;
  text-align: center;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  max-width: 500px;
  margin: auto;
}

button {
  background: #4F46E5;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  margin: 10px;
  transition: 0.3s;
}

button:hover {
  background: #4338CA;
  transform: scale(1.05);
}

#nextBtn {
  display: none;
  background: #22C55E;
}
</style>

</head>

<body>

<div class="card">

  <h2 id="chapterTitle"></h2>

  <p>This is your lesson content 📘</p>

<button onclick="markComplete()">Mark as Complete</button>

  <br>

<button id="nextBtn" onclick="nextChapter()">Next ➡️</button>

  <br>

<button onclick="goToTest()">Take Test</button>

</div>

<script>

let current = parseInt(localStorage.getItem("currentChapter")) || 1;
let course = localStorage.getItem("course") || "html";
let user = localStorage.getItem("currentUser") || "defaultUser";

document.getElementById("chapterTitle").innerText =
  course.toUpperCase() + " - Chapter " + current;


// 🔥 USER-WISE PROGRESS FUNCTIONS
function getProgress(){
  let progress = JSON.parse(localStorage.getItem(user + "_progress")) || {};
  if(!progress[course]) progress[course] = [];
  return progress;
}

function saveProgress(progress){
  localStorage.setItem(user + "_progress", JSON.stringify(progress));
}


// 📌 MARK COMPLETE (UNCHANGED LOGIC + USER FIX)
function markComplete(){

  let progress = getProgress();

  if(!progress[course].includes(current)){
    progress[course].push(current);
  }

  saveProgress(progress);

  document.getElementById("nextBtn").style.display = "inline-block";
}


// 📌 NEXT CHAPTER (UNCHANGED)
function nextChapter(){

  let next = current + 1;

  if(next <= 30){
    localStorage.setItem("currentChapter", next);
    location.reload();
  } else {
    alert("Course Completed 🎉");
  }
}


// 📌 TEST BUTTON (UNCHANGED)
function goToTest(){

  let progressData = getProgress();
let completed = progressData[course] ? progressData[course].length : 0;

if(completed < 30){
    alert("Complete all chapters before taking test!");
    return;
  }

  if(course === "html"){
    window.location.href = "htmltest.html";
  }
  else if(course === "python"){
    window.location.href = "pythontest.html";
  }
  else if(course === "java"){
    window.location.href = "javatest.html";
  }
  else if(course === "css"){
    window.location.href = "csstest.html";
  }
else if(course === "web development"){
    window.location.href = "webdevtest.html";
  }
else if(course === "communication"){
    window.location.href = "communicationtest.html";
  }

}


// 📌 AUTO SHOW NEXT BUTTON (UNCHANGED)
window.onload = function(){

  let progress = getProgress();

  if(progress[course].includes(current)){
    document.getElementById("nextBtn").style.display = "inline-block";
  }
}

</script>

</body>
</html>
