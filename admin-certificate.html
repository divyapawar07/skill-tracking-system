<!DOCTYPE html>
<html>
<head>
<title>Admin Certificate Lookup</title>
<style>
body{font-family:Arial;padding:40px;}
input,button{padding:8px;margin:5px;}
</style>
</head>
<body>

<h2>Admin Certificate Verification</h2>

<input type="text" id="certID" placeholder="Enter Certificate ID">
<button onclick="verify()">Verify</button>

<div id="result"></div>

<script>
function verify(){
    let id=document.getElementById("certID").value;
    let data=localStorage.getItem(id);

    if(data){
        let cert=JSON.parse(data);
        document.getElementById("result").innerHTML=`
        <h3 style='color:green;'>Valid Certificate</h3>
        Name: ${cert.name}<br>
        Course: ${cert.course}<br>
        Score: ${cert.score}%<br>
        Date: ${cert.date}
        `;
    }else{
        document.getElementById("result").innerHTML=
        "<h3 style='color:red;'>Invalid Certificate</h3>";
    }
}
</script>

</body>
</html>
