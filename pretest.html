<!DOCTYPE html>
<html>
<body>

<h2>Pre-Test</h2>

<form id="quizForm">

  <p>1. What is HTML?</p>
  <input type="radio" name="q1" value="0"> Programming Language<br>
  <input type="radio" name="q1" value="1"> Markup Language<br><br>

  <p>2. CSS is used for?</p>
  <input type="radio" name="q2" value="1"> Styling<br>
  <input type="radio" name="q2" value="0"> Database<br><br>

  <button type="button" onclick="submitPre()">Submit</button>

</form>

<script>
function submitPre() {

  let score = 0;

  let answers = document.querySelectorAll('input[type="radio"]:checked');

  answers.forEach(ans => {
    score += Number(ans.value);
  });

  score = (score / 2) * 100;

  localStorage.setItem("preScore", score);

  alert("Pre-Test Score: " + score + "%");

  window.location.href = "training.html";
}
</script>

</body>
</html>
