<!DOCTYPE html>
<html>
<head>
    <title>Certificates - SkillTrack</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            padding:30px;
        }

        h2{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse: collapse;
            background:white;
            margin-top:20px;
        }

        th,td{
            padding:12px;
            border:1px solid #ddd;
            text-align:center;
        }

        th{
            background:#2c3e50;
            color:white;
        }

        button{
            padding:8px 15px;
            background:#27ae60;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:#219150;
        }
    </style>
</head>
<body>

<h2>🎓 Your Certificates</h2>

<table>
    <thead>
        <tr>
            <th>Course</th>
            <th>Score</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="certificateTable">
    </tbody>
</table>

<script>
let testHistory = JSON.parse(localStorage.getItem("testHistory")) || [];
let table = document.getElementById("certificateTable");

testHistory.forEach((test,index)=>{
    if(test.score >= 50){

        let row = `
        <tr>
            <td>${test.course}</td>
            <td>${test.score}%</td>
            <td>${test.date}</td>
            <td>
                <button onclick="viewCertificate(${index})">
                    View Certificate
                </button>
            </td>
        </tr>
        `;

        table.innerHTML += row;
    }
});

function viewCertificate(index){
    localStorage.setItem("selectedCertificateIndex", index);
    window.location.href = "certificate.html";
}
</script>

</body>
</html>
