<!DOCTYPE html>
<html>
<body>

<h2>Final Test</h2>

<form id="quizForm">

  <p>1. HTML stands for?</p>
  <input type="radio" name="q1" value="1"> Hyper Text Markup Language<br>
  <input type="radio" name="q1" value="0"> High Text Machine Language<br><br>

  <p>2. Which is CSS property?</p>
  <input type="radio" name="q2" value="1"> color<br>
  <input type="radio" name="q2" value="0"> print<br><br>

  <button type="button" onclick="submitPost()">Submit</button>

</form>

<script>
function submitPost() {

  let score = 0;

  let answers = document.querySelectorAll('input[type="radio"]:checked');

  answers.forEach(ans => {
    score += Number(ans.value);
  });

  score = (score / 2) * 100;

  localStorage.setItem("postScore", score);

  alert("Final Score: " + score + "%");

  window.location.href = "reports.html";
}
</script>

</body>
</html>
