<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:Poppins;
  display:flex;
  background:#f4f6f9;
}
.sidebar{
  width:240px;
  background:#111827;
  color:white;
  height:100vh;
  padding:20px;
}
.sidebar h2{
  margin-bottom:30px;
}
.sidebar li{
  list-style:none;
  padding:12px;
  cursor:pointer;
  border-radius:6px;
}
.sidebar li:hover{
  background:#374151;
}
.main{
  flex:1;
  padding:30px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}
.card-container{
  display:flex;
  gap:20px;
  margin-bottom:30px;
}
.card{
  background:white;
  padding:20px;
  border-radius:12px;
  flex:1;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.section{
  display:none;
}
.section.active{
  display:block;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
}
th{
  background:#1f2937;
  color:white;
}
button{
  padding:8px 12px;
  border:none;
  background:#2563eb;
  color:white;
  border-radius:6px;
  cursor:pointer;
}
button:hover{
  background:#1d4ed8;
}
</style>
</head>
<body>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <ul>
    <li onclick="showSection('dashboard')">Dashboard</li>
    <li onclick="showSection('users')">Manage Users</li>
    <li onclick="showSection('courses')">Course Stats</li>
    <li onclick="logout()">Logout</li>
  </ul>
</div>

<div class="main">

<div class="topbar">
  <h2 id="adminWelcome"></h2>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
  <div class="card-container">
    <div class="card">
      <h3>Total Users</h3>
      <p>200</p>
    </div>
    <div class="card">
      <h3>Total Courses</h3>
      <p>6</p>
    </div>
    <div class="card">
      <h3>Total Managers</h3>
      <p>5</p>
    </div>
  </div>
</div>

<!-- USERS SECTION -->
<div id="users" class="section">
  <h3>Users List</h3>
  <table>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
    </tr>
    <tr>
      <td>Amit</td>
      <td>amit@gmail.com</td>
      <td>Student</td>
    </tr>
    <tr>
      <td>Priya</td>
      <td>priya@gmail.com</td>
      <td>Manager</td>
    </tr>
  </table>
</div>

<!-- COURSE STATS -->
<div id="courses" class="section">
  <h3>Course-wise Students</h3>
  <table>
    <tr>
      <th>Course</th>
      <th>Students Enrolled</th>
    </tr>
    <tr>
      <td>Java</td>
      <td>25</td>
    </tr>
    <tr>
      <td>Python</td>
      <td>40</td>
    </tr>
  </table>
</div>

</div>

<script>

let username = localStorage.getItem("username");
let role = localStorage.getItem("role");

if(role !== "Admin"){
  window.location.href = "login.html";
}

document.getElementById("adminWelcome").innerText =
"Welcome Admin, " + username;

function showSection(id){
  let sections = document.querySelectorAll(".section");
  sections.forEach(sec => sec.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function logout(){
  localStorage.clear();
  window.location.href="login.html";
}

</script>

</body>
</html>
